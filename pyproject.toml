[project]
name = "dopyi"
dynamic = ["version"]
description = "DOors PYthon Interface with pandas"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Elia Ribaldone"}]
dependencies = [
    "icecream>=2.1.3,<3.0.0",
    "pandas>=2,<3",
    "easygui>=0.98.3,<1.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "xlsxwriter>=3.1.2,<4.0.0",
    "gooey>=1.0.8.1,<2.0.0",
    "freesimplegui>=5.1.0,<6.0.0",
    "pydantic>=2.4.2,<3.0.0",
    "quantiphy>=2.19,<3.0.0",
    "pint>=0.22,<1.0.0",
    "xlrd>=2.0.1,<3.0.0",
    "fastparquet>=2024.5.0,<2025.0.0",
    "polars>=1.4.1,<2.0.0",
]

[project.scripts]
dopyi_gui = "dopyi.gui:gui"

[dependency-groups]
dev = [
    "pre-commit>=2.20.0,<3.0.0",
    "pycodestyle>=2.10.0,<3.0.0",
    "pytest>=7.4.0,<8.0.0",
    "ipykernel>=6.25.2,<7.0.0",
]

[build-system]
requires = [
    "setuptools>=41",
    "wheel",
    "setuptools-scm>=8.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dopyi*"]

[tool.setuptools.package-data]
dopyi = [
    "logo/*.ico",
]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
tag_regex = "^(?P<prefix>v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"
fallback_version = "0.0.0"
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "[0-9]*.[0-9]*.[0-9]*",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
# Tests needing a real DOORS installation are deselected by default;
# run them with: pytest -m doors
addopts = "-m 'not doors'"
markers = [
    "doors: requires a real local DOORS installation (deselected by default)",
    "del_module",
    "check_reload",
    "new_objects",
    "new_view",
    "change_values",
    "add_rows",
    "to_excel",
    "from_excel",
    "get_last_baseline",
    "dxl_create_links",
    "dxl_delete_links",
    "dxl_delete_all_obj_links",
    "dxl_create_link_by_attr",
]
